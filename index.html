<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPT หลักฐานเข้า-ออกงาน</title>
<style>
  :root{--pri:#1F4E78;--ok:#1E8E3E;--warn:#E37400;--err:#C5221F;--bg:#F4F6F8;--card:#fff;--txt:#202124;--mut:#5F6368}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Sarabun","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
  header{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:18px} header small{opacity:.85}
  main{padding:12px 16px 120px;max-width:560px;margin:auto}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  h2{font-size:15px;margin:0 0 10px;color:var(--pri)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg button{padding:14px;border-radius:10px;border:2px solid #DADCE0;background:#fff;font-size:17px;font-weight:600}
  .seg button.on.in{border-color:var(--ok);background:#E6F4EA;color:var(--ok)}
  .seg button.on.out{border-color:var(--warn);background:#FEF3E8;color:var(--warn)}
  input[type=search],input[type=text],select{width:100%;padding:12px;border:1px solid #DADCE0;border-radius:10px;font-size:16px}
  .list{max-height:38vh;overflow:auto;margin-top:8px;border-top:1px solid #eee}
  .row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eee}
  .row input{width:22px;height:22px} .row .id{font-weight:600;min-width:86px} .row .nm{color:var(--mut);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:#E8F0FE;color:var(--pri);border-radius:14px;padding:4px 10px;font-size:13px}
  .cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4}
  video,#preview{width:100%;height:100%;object-fit:cover;display:block}
  #preview{display:none}
  .btn{width:100%;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:700;color:#fff;background:var(--pri)}
  .btn:disabled{background:#9AA0A6}
  .btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.1);display:grid;gap:8px;z-index:5}
  .msg{padding:12px;border-radius:10px;margin-bottom:12px;font-size:15px}
  .msg.ok{background:#E6F4EA;color:var(--ok)} .msg.err{background:#FCE8E6;color:var(--err)} .msg.info{background:#E8F0FE;color:var(--pri)}
  .meta{font-size:13px;color:var(--mut);margin-top:6px}
  .hide{display:none!important}
</style>
</head>
<body>
<header><h1>📸 หลักฐานเข้า-ออกงาน</h1><small id="who">กำลังโหลด…</small></header>

<main>
  <div id="msg"></div>

  <!-- ลงทะเบียนครั้งแรก -->
  <section id="vRegister" class="card hide">
    <h2>ลงทะเบียนครั้งแรก</h2>
    <label>ชื่อ-นามสกุล</label>
    <input id="regName" type="text" placeholder="เช่น สมชาย ใจดี">
    <label style="display:block;margin-top:10px">Hub ที่ประจำ</label>
    <select id="regHub"></select>
    <div style="height:12px"></div>
    <button class="btn" id="btnReg">ส่งคำขอใช้งาน</button>
  </section>

  <section id="vPending" class="card hide">
    <h2>รอแอดมินอนุมัติ</h2>
    <p>ส่งคำขอแล้ว เมื่อแอดมินอนุมัติ ให้เปิดเมนูนี้ใหม่อีกครั้ง</p>
  </section>

  <!-- หน้าหลัก -->
  <section id="vMain" class="hide">
    <div class="card">
      <h2>1) ประเภท</h2>
      <div class="seg">
        <button id="tIn" class="in" data-t="IN">🟢 เข้างาน</button>
        <button id="tOut" class="out" data-t="OUT">🟠 ออกงาน</button>
      </div>
    </div>

    <div class="card">
      <h2>2) เลือกพนักงานในรูป <span id="selCount"></span></h2>
      <input id="q" type="search" placeholder="ค้นหา Ops ID หรือชื่อ">
      <div class="chips" id="chips"></div>
      <div class="list" id="list"></div>
    </div>

    <div class="card">
      <h2>3) ถ่ายรูป (กล้องเท่านั้น)</h2>
      <div class="cam">
        <video id="video" playsinline autoplay muted></video>
        <img id="preview" alt="">
      </div>
      <div class="meta" id="gps">📍 กำลังหาตำแหน่ง…</div>
      <input id="fallback" type="file" accept="image/*" capture="environment" class="hide">
    </div>
  </section>
</main>

<div class="bar hide" id="bar">
  <button class="btn" id="btnShot">📷 ถ่ายรูป</button>
  <button class="btn sec hide" id="btnRetake">ถ่ายใหม่</button>
  <button class="btn hide" id="btnSend">ส่งหลักฐาน</button>
</div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ====== CONFIG: แก้ 2 บรรทัดนี้ ====== */
const LIFF_ID = '2011898098-RDlVCsDR';
const API_URL = 'https://script.google.com/macros/s/AKfycbySUFM2sNeBtfsPgyKfAti77Ugywbe-GuIpCMw58xN7xnFxQIeYTMb0f7tF_HKhqsSG/exec';
/* ===================================== */

const $ = id => document.getElementById(id);
const S = { idToken:null, staff:[], sel:new Set(), type:null, pos:null, shotAt:null, img:null, source:'camera', stream:null, sending:false };

function show(id){ ['vRegister','vPending','vMain'].forEach(v=>$(v).classList.toggle('hide',v!==id)); $('bar').classList.toggle('hide',id!=='vMain'); }
function msg(t,kind='info'){ $('msg').innerHTML = t ? `<div class="msg ${kind}">${t}</div>` : ''; if(t) window.scrollTo(0,0); }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(action, body={}) {
  // text/plain = simple request → ไม่มี CORS preflight กับ Apps Script
  const res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,idToken:S.idToken,...body})});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'เกิดข้อผิดพลาด');
  return j;
}

/* ---------- เริ่มต้น ---------- */
(async function start(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    S.idToken = liff.getIDToken();
    const r = await api('init');
    $('who').textContent = `${r.me.name}${r.me.hub?' · '+r.me.hub:''}`;
    if(r.me.status==='unregistered'){
      $('regHub').innerHTML = '<option value="">— เลือก Hub —</option>' + r.hubs.map(h=>`<option value="${esc(h.code)}">${esc(h.code)} ${h.name!==h.code?esc(h.name):''}</option>`).join('');
      show('vRegister'); return;
    }
    if(r.me.status!=='approved'){ show('vPending'); return; }
    S.staff = r.staff; renderList(); show('vMain'); startGps(); startCamera();
  }catch(e){ msg('❌ '+esc(e.message),'err'); }
})();

$('btnReg').onclick = async ()=>{
  const fullName=$('regName').value.trim(), hub=$('regHub').value;
  if(!fullName||!hub) return msg('กรุณากรอกชื่อและเลือก Hub','err');
  $('btnReg').disabled=true;
  try{ await api('register',{fullName,hub}); msg(''); show('vPending'); }
  catch(e){ msg('❌ '+esc(e.message),'err'); $('btnReg').disabled=false; }
};

/* ---------- ประเภท IN/OUT ---------- */
['tIn','tOut'].forEach(id=>$(id).onclick=e=>{
  S.type=e.currentTarget.dataset.t;
  $('tIn').classList.toggle('on',S.type==='IN'); $('tOut').classList.toggle('on',S.type==='OUT');
});

/* ---------- รายชื่อ ---------- */
function renderList(){
  const q=$('q').value.trim().toLowerCase();
  const rows=S.staff.filter(s=>!q||s.id.toLowerCase().includes(q)||s.name.toLowerCase().includes(q)).slice(0,200);
  $('list').innerHTML=rows.map(s=>`<label class="row"><input type="checkbox" value="${esc(s.id)}" ${S.sel.has(s.id)?'checked':''}><span class="id">${esc(s.id)}</span><span class="nm">${esc(s.name)}</span></label>`).join('') || '<div class="meta">ไม่พบรายชื่อ</div>';
  $('chips').innerHTML=[...S.sel].map(id=>`<span class="chip">${esc(id)}</span>`).join('');
  $('selCount').textContent=S.sel.size?`(${S.sel.size} คน)`:'';
}
$('q').oninput=renderList;
$('list').onchange=e=>{ if(e.target.type!=='checkbox')return; e.target.checked?S.sel.add(e.target.value):S.sel.delete(e.target.value); renderList(); };

/* ---------- GPS ---------- */
function startGps(){
  if(!navigator.geolocation){ $('gps').textContent='📍 เครื่องนี้ไม่รองรับ GPS'; return; }
  navigator.geolocation.watchPosition(p=>{
    S.pos=p.coords; $('gps').textContent=`📍 ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} (±${Math.round(p.coords.accuracy)} ม.)`;
  },()=>{ $('gps').textContent='📍 ไม่ได้รับอนุญาตตำแหน่ง (รูปจะถูกติดธงตรวจสอบ)'; },{enableHighAccuracy:true,maximumAge:30000,timeout:20000});
}

/* ---------- กล้อง ---------- */
async function startCamera(){
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
    $('video').srcObject=S.stream; S.source='camera';
  }catch(e){
    // บางเครื่องเปิดกล้องสดใน LINE ไม่ได้ → ใช้ปุ่มกล้องของระบบแทน (ระบบจะติดธง FILE_INPUT)
    S.source='fallback'; $('video').classList.add('hide');
    msg('เครื่องนี้เปิดกล้องสดไม่ได้ กด "ถ่ายรูป" เพื่อเปิดกล้องของเครื่อง','info');
  }
}

$('btnShot').onclick=()=>{
  if(S.source==='fallback'){ $('fallback').click(); return; }
  const v=$('video'); drawAndStamp(v,v.videoWidth,v.videoHeight);
};
$('fallback').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image(); img.onload=()=>drawAndStamp(img,img.naturalWidth,img.naturalHeight); img.src=URL.createObjectURL(f);
};

function drawAndStamp(src,w,h){
  const max=1280, k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  const g=c.getContext('2d'); g.drawImage(src,0,0,c.width,c.height);
  S.shotAt=new Date();
  const lines=[
    `${S.type||'?'} · ${S.shotAt.toLocaleString('th-TH',{hour12:false})}`,
    S.pos?`GPS ${S.pos.latitude.toFixed(5)},${S.pos.longitude.toFixed(5)}`:'GPS -',
    [...S.sel].slice(0,6).join(' ')+(S.sel.size>6?` +${S.sel.size-6}`:'')
  ];
  const fs=Math.round(c.width/32); g.font=`bold ${fs}px sans-serif`;
  const bh=fs*1.4*lines.length+fs*.6; g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(0,c.height-bh,c.width,bh);
  g.fillStyle='#fff'; lines.forEach((t,i)=>g.fillText(t,fs*.5,c.height-bh+fs*1.3*(i+1)));
  S.img=c.toDataURL('image/jpeg',0.8);
  $('preview').src=S.img; $('preview').style.display='block'; $('video').classList.add('hide');
  toggleShot(false);
}
function toggleShot(canShoot){
  $('btnShot').classList.toggle('hide',!canShoot);
  $('btnRetake').classList.toggle('hide',canShoot); $('btnSend').classList.toggle('hide',canShoot);
}
$('btnRetake').onclick=()=>{ S.img=null; S.reqId=null; $('preview').style.display='none'; if(S.source==='camera')$('video').classList.remove('hide'); toggleShot(true); };

/* ---------- ส่ง ---------- */
$('btnSend').onclick=async()=>{
  if(S.sending)return;
  if(!S.type) return msg('กรุณาเลือก เข้างาน / ออกงาน','err');
  if(!S.sel.size) return msg('กรุณาเลือกพนักงานในรูปอย่างน้อย 1 คน','err');
  if(!S.img) return msg('กรุณาถ่ายรูป','err');
  S.sending=true; $('btnSend').disabled=true; $('btnSend').textContent='กำลังส่ง…';
  const clientReqId = S.reqId || (S.reqId = (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)));
  try{
    const r=await api('upload',{
      clockType:S.type, opsIds:[...S.sel], imageBase64:S.img, clientTime:S.shotAt.toISOString(),
      lat:S.pos?S.pos.latitude:null, lng:S.pos?S.pos.longitude:null, accuracy:S.pos?Math.round(S.pos.accuracy):null,
      source:S.source, clientReqId
    });
    msg(r.duplicate?'ℹ️ รูปนี้ส่งไปแล้ว':`✅ บันทึกแล้ว ${r.count} คน · เวลา ${esc(r.serverTime)}${r.flags&&r.flags.length?'<br>⚠️ ติดธง: '+esc(r.flags.join(', ')):''}`, r.flags&&r.flags.length?'info':'ok');
    S.sel.clear(); S.reqId=null; renderList(); $('btnRetake').click();
  }catch(e){
    msg('❌ ส่งไม่สำเร็จ: '+esc(e.message)+'<br>กด "ส่งหลักฐาน" อีกครั้งได้เลย (ไม่เกิดรูปซ้ำ)','err');
  }finally{ S.sending=false; $('btnSend').disabled=false; $('btnSend').textContent='ส่งหลักฐาน'; }
};
</script>
</body>
</html>
